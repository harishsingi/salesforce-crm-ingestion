<text x="600.0" y="766.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">SELF-HEALING:  DOWN 1 DAY OR 10, THE NEXT RUN RESUMES FROM THE WATERMARK  ·  NO GAPS · NO FULL RELOADS · CATCH-UP IS AUTOMATIC</text>
