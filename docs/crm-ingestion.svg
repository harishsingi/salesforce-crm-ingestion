<text x="600.0" y="691.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">DQ ON SEM  ·  EVERY DAY AT NOON  ·  timestamp field checked  ·  no new data → alert</text>
